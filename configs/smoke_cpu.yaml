# CPU smoke test -- tiny subset, downscaled input, a few steps.
# Verifies the full pipeline (data -> losses -> backward) end to end.
data:
  syn_root: /home/jgxy/work/UniCD/IRBFD-syn/VOC2007
  real_root: /home/jgxy/work/UniCD/IRBFD-real/VOC2007
  coef_cache: /home/jgxy/work/UniCD/UniCD-repro/outputs/coef_cache_syn.npz
  batch_size: 2
  num_workers: 2
  hflip: 0.5
  scale: 0.25            # 160x128 input (or 0.5 for 320x256)

model:
  degree: 3

train:
  stage: joint
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  lambda_tebs_first: 1.0
  lambda_tebs_after: 0.01
  lambda_switch_epoch: 20
  use_br: true
  seed: 42
  resume: null

output:
  save_dir: outputs/smoke
  log_every: 2
  save_every: 1
  max_iters_per_epoch: 20   # CPU smoke: only run 20 iterations
