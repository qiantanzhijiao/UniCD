# Stage 3 -- detection fine-tuning on IRBFD-real, NUC frozen (UniCD* setup)
data:
  syn_root: /home/jgxy/work/UniCD/IRBFD-syn/VOC2007
  real_root: /home/jgxy/work/UniCD/IRBFD-real/VOC2007
  coef_cache: /home/jgxy/work/UniCD/UniCD-repro/outputs/coef_cache_syn.npz
  batch_size: 4
  num_workers: 8
  hflip: 0.5
  scale: 1.0

model:
  degree: 3

train:
  stage: finetune_real
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  freeze_nuc: true
  lambda_tebs_after: 0.01
  seed: 42
  resume: outputs/joint/epoch_050.pt   # joint-trained weights

output:
  save_dir: outputs/real
  log_every: 20
  save_every: 5
