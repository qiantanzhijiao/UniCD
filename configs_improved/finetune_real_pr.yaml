# Stage 3 (improved) -- detection fine-tuning on IRBFD-real, NUC frozen.
# The perturbation augmentation also regularises the detector here (no clear
# pairs, so no L_res / L_BR at this stage).
data:
  syn_root: /home/jgxy/work/UniCD/IRBFD-syn/VOC2007
  real_root: /home/jgxy/work/UniCD/IRBFD-real/VOC2007
  coef_cache: /home/jgxy/work/UniCD/UniCD-repro/outputs/coef_cache_syn.npz
  batch_size: 4
  num_workers: 8
  hflip: 0.5
  scale: 1.0

model:
  degree: 3
  residual:
    enabled: true
    gate: true

train:
  stage: finetune_real
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  freeze_nuc: true
  lambda_tebs_after: 0.01
  perturb:
    enabled: true
    p: 0.5
    types: [hres, stripe, gain]
    strength: 1.0
  seed: 42
  resume: outputs_improved/joint_pr/epoch_050.pt

output:
  save_dir: outputs_improved/real_pr
  log_every: 20
  save_every: 5
