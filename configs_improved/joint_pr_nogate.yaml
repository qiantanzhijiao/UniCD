# Ablation: joint training with the residual branch but NO gate and NO
# perturbation. Isolates the contribution of the free-form residual bias map
# itself (vs the poly-only baseline).
data:
  syn_root: /home/jgxy/work/UniCD/IRBFD-syn/VOC2007
  real_root: /home/jgxy/work/UniCD/IRBFD-real/VOC2007
  coef_cache: /home/jgxy/work/UniCD/UniCD-repro/outputs/coef_cache_syn.npz
  batch_size: 4
  num_workers: 8
  hflip: 0.5
  scale: 1.0

model:
  degree: 3
  residual:
    enabled: true
    gate: false

train:
  stage: joint
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  lambda_tebs_first: 1.0
  lambda_tebs_after: 0.01
  lambda_switch_epoch: 20
  use_br: true
  lambda_res: 1.0
  seed: 42
  resume: outputs_improved/pretrain_pr_nogate/epoch_030.pt

output:
  save_dir: outputs_improved/joint_pr_nogate
  log_every: 20
  save_every: 5
