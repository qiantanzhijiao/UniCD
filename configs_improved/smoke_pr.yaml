# CPU smoke test for the improved scheme (residual + gate + perturbation).
# Tiny subset, downscaled input, a few steps -- verifies the full pipeline
# end to end on machines without a GPU.
data:
  syn_root: /home/jgxy/work/UniCD/IRBFD-syn/VOC2007
  real_root: /home/jgxy/work/UniCD/IRBFD-real/VOC2007
  coef_cache: /home/jgxy/work/UniCD/UniCD-repro/outputs/coef_cache_syn.npz
  batch_size: 2
  num_workers: 2
  hflip: 0.5
  scale: 0.25            # 160x128 input

model:
  degree: 3
  residual:
    enabled: true
    gate: true

train:
  stage: joint
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  lambda_tebs_first: 1.0
  lambda_tebs_after: 0.01
  lambda_switch_epoch: 20
  use_br: true
  lambda_res: 1.0
  perturb:
    enabled: true
    p: 0.5
    types: [hres, stripe, gain]
    strength: 1.0
  seed: 42
  resume: null

output:
  save_dir: outputs_improved/smoke_pr
  log_every: 2
  save_every: 1
  max_iters_per_epoch: 20   # CPU smoke: only run 20 iterations
